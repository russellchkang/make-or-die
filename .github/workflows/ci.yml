name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The previous steps here tolerated exit 124, because the suite used to
      # hang after finishing. The cause was a quadratic tokenizer path in
      # estimateTokens (see src/agent/context.ts); with that fixed the full
      # suite runs in ~75s and exits cleanly, so a hang is now a real failure
      # and must not be swallowed.
      - name: Run tests
        timeout-minutes: 10
        run: pnpm test
      - name: Run security tests
        timeout-minutes: 10
        run: pnpm test -- --testNamePattern "security|injection|policy|financial"

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true
